<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Strategy, content, development and automation handled in-house by one strategist in Dhaka"><style>.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}</style><rect width="1200" height="900" fill="#fafafa"/><rect x="104" y="150" width="6" height="496" rx="3" fill="#e8a013"/><rect x="140" y="150" width="920" height="112" rx="14" fill="#ffffff" stroke="#e8e8e8"/><rect x="172" y="182" width="48" height="48" rx="12" fill="#111111"/><text class="t" x="196" y="213" font-size="19" font-weight="600" fill="#e8a013" text-anchor="middle">1</text><text class="t" x="244" y="202" font-size="25" font-weight="600" fill="#111111">Strategy</text><text class="t" x="244" y="232" font-size="17" fill="#888888">Search architecture and priorities</text><rect x="140" y="278" width="920" height="112" rx="14" fill="#ffffff" stroke="#e8e8e8"/><rect x="172" y="310" width="48" height="48" rx="12" fill="#111111"/><text class="t" x="196" y="341" font-size="19" font-weight="600" fill="#e8a013" text-anchor="middle">2</text><text class="t" x="244" y="330" font-size="25" font-weight="600" fill="#111111">Content &amp; Semantics</text><text class="t" x="244" y="360" font-size="17" fill="#888888">Entity coverage built to be retrieved</text><rect x="140" y="406" width="920" height="112" rx="14" fill="#ffffff" stroke="#e8e8e8"/><rect x="172" y="438" width="48" height="48" rx="12" fill="#111111"/><text class="t" x="196" y="469" font-size="19" font-weight="600" fill="#e8a013" text-anchor="middle">3</text><text class="t" x="244" y="458" font-size="25" font-weight="600" fill="#111111">Development</text><text class="t" x="244" y="488" font-size="17" fill="#888888">Shipped in code, not just advised</text><rect x="140" y="534" width="920" height="112" rx="14" fill="#ffffff" stroke="#e8e8e8"/><rect x="172" y="566" width="48" height="48" rx="12" fill="#111111"/><text class="t" x="196" y="597" font-size="19" font-weight="600" fill="#e8a013" text-anchor="middle">4</text><text class="t" x="244" y="586" font-size="25" font-weight="600" fill="#111111">Automation &amp; Reporting</text><text class="t" x="244" y="616" font-size="17" fill="#888888">Monitoring that runs on its own</text><rect x="140" y="690" width="920" height="76" rx="16" fill="#111111"/><circle cx="186" cy="728" r="7" fill="#e8a013"/><text class="t" x="600" y="737" font-size="23" font-weight="600" fill="#ffffff" text-anchor="middle">One strategist in Dhaka — no hand-offs, no lost context</text><text class="t" x="600" y="820" font-size="17" fill="#888888" text-anchor="middle">The same person audits it, writes it, builds it and reports on it</text><g id="rk-watermark"><image href="data:image/png;base64," x="1072" y="38" width="36" height="36"/><text x="1058" y="62" text-anchor="end" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="600" fill="#9a9a9a">growwithrokibul.com</text></g></svg>